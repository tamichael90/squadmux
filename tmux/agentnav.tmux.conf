# agentnav: install.sh appends this to ~/.tmux.conf between "# >>> agentnav >>>" markers.
set -g mouse on
set -g focus-events on
# Pass Ctrl-Shift / Ctrl-punctuation chords through to Neovim (needs a terminal that sends them too).
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
source-file ~/.config/agentnav/agentnav.tmux
